name: Brægn Profile Maintenance

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update profile timestamp
        shell: bash
        run: |
          mkdir -p .github/generated

          cat > .github/generated/last-update.md <<EOF
          <!--
          This file is generated automatically.
          Do not edit manually.
          -->

          Last automated update: $(date -u +"%Y-%m-%d %H:%M UTC")
          EOF

      - name: Commit generated metadata
        uses: EndBug/add-and-commit@v9
        with:
          add: ".github/generated/last-update.md"
          message: "chore: update profile metadata"
